name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_NDK_VERSION=26.1.10909125" >> $GITHUB_ENV

      - name: Build TDLib (tdjson, arm64-v8a only)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gperf php-cli
          git clone --depth 1 https://github.com/tdlib/td.git /tmp/td
          cd /tmp/td/example/android
          # Restrict both scripts to arm64-v8a only (verified against the real script text —
          # the previous attempt used a guessed format that never actually matched).
          sed -i "s/for ABI in arm64-v8a armeabi-v7a x86_64 x86 ; do/for ABI in arm64-v8a ; do/" build-openssl.sh build-tdlib.sh
          ./build-openssl.sh "$ANDROID_HOME" "$ANDROID_NDK_VERSION" "$(pwd)/openssl" ""
          ./build-tdlib.sh "$ANDROID_HOME" "$ANDROID_NDK_VERSION" "$(pwd)/openssl" "" "JSON"
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          find tdlib/libs -name "libtdjson.so" -exec cp {} "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libtdjson.so" \;
        continue-on-error: false

      - name: Decode debug signing key
        run: base64 -d app/tuned-debug.keystore.b64.txt > app/tuned-debug.keystore

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tuned-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
